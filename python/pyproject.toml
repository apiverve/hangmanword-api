[project]
name = "apiverve-hangmanwordgenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Hangman Word Generator provides random hangman words for word games, with difficulty levels based on word length and, on paid plans, category filtering."
keywords = ["hangman word generator", "hangman words generator", "hangman generator", "hangman api", "hangman categories"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/hangmanword?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/hangmanword?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/hangmanword-api"
Twitter = "https://twitter.com/apivervehq"
